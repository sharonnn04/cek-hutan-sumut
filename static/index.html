<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Kawasan Hutan Sumut</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><p class="eyebrow">SK 11580 TAHUN 2025</p><h1>Cek Titik Kawasan Hutan Sumatera Utara</h1></div><button id="account">Masuk / Daftar</button></header>
<section class="card"><h2>Periksa lokasi</h2><div class="tabs"><button class="tab active" data-panel="decimal">Koordinat</button><button class="tab" data-panel="dms">DMS</button><button class="tab" data-panel="address">Alamat</button></div>
<form id="decimal" class="panel"><label>Lintang<input name="lat" type="number" step="any" placeholder="contoh: 3.5952" required></label><label>Bujur<input name="lng" type="number" step="any" placeholder="contoh: 98.6722" required></label><button>Periksa titik</button></form>
<form id="dms" class="panel hidden"><label>Lintang DMS<input name="lat" placeholder="3° 35' 42.7 N" required></label><label>Bujur DMS<input name="lng" placeholder="98° 40' 19.9 E" required></label><button>Konversi & periksa</button></form>
<form id="address" class="panel hidden"><label>Alamat<input name="q" placeholder="contoh: Medan, Sumatera Utara" required></label><button>Cari alamat</button></form><div id="choices"></div></section>
<section id="result" class="card hidden"></section><section id="history" class="card hidden"><h2>Riwayat saya</h2><div id="history-items"></div></section>
<p class="note">Tanpa akun, pemeriksaan tetap dapat digunakan. Batas gratis: 5 titik per 24 jam. Akun menyimpan riwayat pemeriksaan.</p></main><dialog id="auth"><button class="close">×</button><h2>Masuk atau daftar</h2><form id="auth-form"><label>Nama <small>(untuk daftar)</small><input name="name"></label><label>Email<input name="email" type="email" required></label><label>Kata sandi<input name="password" type="password" minlength="8" required></label><div><button name="action" value="login">Masuk</button><button name="action" value="register" class="secondary">Daftar</button></div></form><p id="auth-message"></p></dialog><script src="/static/app.js"></script></body></html>
